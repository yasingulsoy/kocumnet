# Nixpacks, bu dosya olmadan Node 18'e düşüyor ve build şu hatayla ölüyor:
#   "You are using Node.js 18.20.5. For Next.js, Node.js version >=20.9.0 is required."
# frontend/ ve admin/ ile aynı desen.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
# vips: sharp'ın görsel işleme bağımlılığı (şekil yükleme onsuz çalışmaz).
nixPkgs = ["nodejs_22", "vips"]
# Prisma 7 en az Node 20.19 ya da 22.12 istiyor. Nixpacks'in kendi sabitlediği
# nixpkgs'te nodejs_20 = 20.18.1, nodejs_22 = 22.11.0: `npm ci` prisma'nın kurulum
# denetiminde düşüyor. Bu commit nixos-25.05'in sonuncusu (nodejs_22 = 22.20.0).
nixpkgsArchive = "ac62194c3917d5f474c1a844b6fd6da2db95077d"

[phases.install]
cmds = ["npm ci"]

[phases.build]
# build script'i zaten `prisma generate` ile başlıyor — üretilen client
# gitignore'da olduğu için bu ADIM ATLANAMAZ.
cmds = ["npm run build"]

[start]
# Migration'lar uygulama açılmadan ÖNCE çalışmalı: yeni bir sürüm, şemada
# olmayan bir alanı sorgularsa ilk istekte 500 döner.
cmd = "npx prisma migrate deploy && npm run start"

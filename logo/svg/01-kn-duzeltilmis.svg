<!--
  YÖN 1 — Senin "Kn" fikrinin düzeltilmiş hâli.

  Değişenler:
  · Sarı + yeşil çıktı, yerine marka mavileri geldi. "n" vurgusu için
    camgöbeği (#0e90d5) kullanıldı — aynı ailenin en canlı tonu.
  · "n" kareden taşmıyor, içeride. Taşan hâli 16px'te lekeye dönüşüyordu.
  · K 32 birimlik ızgaraya oturtuldu, kollar tek noktada birleşiyor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Koçum.Net">
  <defs>
    <linearGradient id="kn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17305e" />
      <stop offset="0.55" stop-color="#1a5fb4" />
      <stop offset="1" stop-color="#0e90d5" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#kn-bg)" />

  <!-- K: gövde + iki kol, hepsi tek kalınlıkta -->
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M10.4 8.6 V 23.4" />
    <path d="M12.1 16 L 18.6 9.6" />
    <path d="M12.1 16 L 18.9 23.4" />
  </g>

  <!-- n: küçük, sağ altta, kare İÇİNDE -->
  <path
    d="M22.4 23.4 V 17.6 a 2.6 2.6 0 0 1 5.2 0 V 23.4"
    fill="none"
    stroke="#8ecdf5"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

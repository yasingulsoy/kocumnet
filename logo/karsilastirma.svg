  <use href="#kn" x="360" y="190" width="16" height="16"/>
  <text x="368" y="222" class="c">16px</text>
  <text x="40" y="270" class="h">YÖN 2 · önerim</text>
  <text x="40" y="289" class="s">K’nın üst kolu yükseliyor, ucunda check-up işaretiyle ortak nokta var.</text>
  <use href="#knokta" x="40" y="310" width="96" height="96"/>
  <text x="88" y="422" class="c">96px</text>
  <use href="#knokta" x="166" y="358" width="48" height="48"/>
  <text x="190" y="422" class="c">48px</text>
  <use href="#knokta" x="244" y="374" width="32" height="32"/>
  <text x="260" y="422" class="c">32px</text>
  <use href="#knokta" x="306" y="382" width="24" height="24"/>
  <text x="318" y="422" class="c">24px</text>
  <use href="#knokta" x="360" y="390" width="16" height="16"/>
  <text x="368" y="422" class="c">16px</text>
  <text x="40" y="470" class="h">YÖN 3 · en sade</text>
  <text x="40" y="489" class="s">Sadece K. Her boyutta, her baskı tekniğinde sorunsuz.</text>
  <use href="#ksade" x="40" y="510" width="96" height="96"/>
  <text x="88" y="622" class="c">96px</text>
  <use href="#ksade" x="166" y="558" width="48" height="48"/>
  <text x="190" y="622" class="c">48px</text>
  <use href="#ksade" x="244" y="574" width="32" height="32"/>
  <text x="260" y="622" class="c">32px</text>
  <use href="#ksade" x="306" y="582" width="24" height="24"/>
  <text x="318" y="622" class="c">24px</text>
  <use href="#ksade" x="360" y="590" width="16" height="16"/>
  <text x="368" y="622" class="c">16px</text>
  <text x="40" y="670" class="h">MEVCUT · check-up uygulaması</text>
  <text x="40" y="689" class="s">Onay işaretinin sağ kolu yükselen grafik çizgisine dönüşüyor.</text>
  <use href="#checkup" x="40" y="710" width="96" height="96"/>
  <text x="88" y="822" class="c">96px</text>
  <use href="#checkup" x="166" y="758" width="48" height="48"/>
  <text x="190" y="822" class="c">48px</text>
  <use href="#checkup" x="244" y="774" width="32" height="32"/>
  <text x="260" y="822" class="c">32px</text>
  <use href="#checkup" x="306" y="782" width="24" height="24"/>
  <text x="318" y="822" class="c">24px</text>
  <use href="#checkup" x="360" y="790" width="16" height="16"/>
  <text x="368" y="822" class="c">16px</text>
  <text x="40" y="870" class="h">MEVCUT · canlı sitedeki işaret</text>
  <text x="40" y="889" class="s">Soyut çift yaprak. Ne K ile ne check-up ile akraba.</text>
  <use href="#eski" x="40" y="910" width="96" height="96"/>
  <text x="88" y="1022" class="c">96px</text>
  <use href="#eski" x="166" y="958" width="48" height="48"/>
  <text x="190" y="1022" class="c">48px</text>

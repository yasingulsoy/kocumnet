name: CI

# Her push ve PR'da dört proje: tip denetimi, lint, üretim derlemesi.
# Derlemeler veritabanı istemez: `next build` yalnızca `prisma generate` çalıştırır,
# site derlemesi backend'e ulaşamayınca boş liste ile devam eder.
# Check-up'ın uçtan uca testleri (checkup-e2e) ise geçici bir Postgres'e karşı koşar.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-tokens:
    name: Tasarım belirteçleri ve marka dosyaları eşit mi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node design/sync.mjs --check

  next:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [frontend, app, admin]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Derleme için yer tutucu; gerçek değerler Dokploy'da.
      NEXT_PUBLIC_SITE_URL: https://kocum.net
      NEXT_PUBLIC_BACKEND_URL: https://api.kocum.net
      NEXT_PUBLIC_APP_URL: https://checkup.kocum.net
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CHECKUP_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - name: Şema kopyası güncel mi (yalnızca admin)
        if: matrix.project == 'admin'
        run: npm run checkup:check
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  checkup-e2e:
    # Öğrenciye giden veride cevap anahtarı var mı (test:leak) ve telafide soru
    # tekrar ediyor mu (test:levels). İkisi de sessiz kusurlar: arayüz çalışmaya
    # devam eder, ölçüm anlamsızlaşır. Gerçek bir Postgres'e karşı koşar.
    name: Check-up uçtan uca (sızıntı + seviyeler)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: checkup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d checkup"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/checkup?schema=public
      NEXT_PUBLIC_APP_URL: https://checkup.kocum.net
      NEXT_PUBLIC_SITE_URL: https://kocum.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Şema
        run: npx prisma migrate deploy
      - name: Tohum (konu ağacı, paketler, demo sorular, seviyeler)
        run: npm run db:seed && npm run db:seed:demo && npm run db:seed:levels
      - run: npm run smoke
      - run: npm run test:markup
      - run: npm run test:leak
      - run: npm run test:levels

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Sözdizimi denetimi
        run: for f in server.js routes/*.js middleware/*.js models/*.js utils/*.js config/*.js scripts/*.js; do node --check "$f"; done
      - name: Mail şablonu çalışıyor mu
        env:
          JWT_SECRET: ci-only-secret-value-that-is-long-enough-123456
          DB_HOST: localhost
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          FRONTEND_URL: https://kocum.net
          BACKEND_URL: https://api.kocum.net
          NODE_ENV: development
        run: node -e "const m=require('./utils/mailer.js'); const r=m.renderMail({baslik:'CI',metin:['ok']}); if(!r.html.includes('CI')) process.exit(1); console.log('şablon ok')"

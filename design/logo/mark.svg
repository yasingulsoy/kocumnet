<!--
  YÖN 2 — ÖNERİM.

  Fikir: K'nın üst kolu yükselen bir çizgiye dönüşüp ucunda bir noktayla
  bitiyor. Bu nokta check-up uygulamasının işaretindeki noktanın aynısı —
  orada onay işaretinin sağ kolu yükselen grafik çizgisine dönüşüp aynı
  noktayla bitiyor.

  Böylece iki ürün akraba görünüyor: ana marka "K", ürün "✓", ikisinde de
  aynı yükselen hareket ve aynı nokta. Tek şekil, tek renk çalışabiliyor,
  16px'te de K olarak okunuyor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Koçum.Net">
  <defs>
    <linearGradient id="kn2-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17305e" />
      <stop offset="0.55" stop-color="#1a5fb4" />
      <stop offset="1" stop-color="#0e90d5" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#kn2-bg)" />

  <g stroke="#ffffff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- gövde -->
    <path d="M11 8.8 V 23.2" />
    <!-- alt kol -->
    <path d="M12.8 16 L 21.4 23.2" />
    <!-- üst kol: yükselen çizgi, nokta için kısaltıldı -->
    <path d="M12.8 16 L 19.8 10.2" />
  </g>

  <!-- Ucundaki nokta — check-up işaretiyle ortak öğe -->
  <circle cx="22.4" cy="8.6" r="2.4" fill="#ffffff" />
</svg>
